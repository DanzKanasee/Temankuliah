<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk · TemanKuliah</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-900 font-sans text-slate-100 flex flex-col">
    <header class="p-6"><div class="max-w-6xl mx-auto font-bold tracking-wide text-indigo-400">TemanKuliah.Id</div></header>
    <main class="flex-grow flex items-center justify-center px-6 py-10">
        <div class="w-full max-w-md rounded-2xl border border-slate-700/60 bg-slate-800/80 p-6 md:p-8 shadow-xl">
            <div class="mb-7 text-center"><h1 class="text-2xl font-bold">Selamat datang kembali</h1><p class="mt-2 text-sm text-slate-400">Masuk untuk mengakses rangkuman dan deadline Anda.</p></div>
            {% if error %}<div role="alert" class="mb-4 rounded-lg border border-rose-500/50 bg-rose-500/10 px-4 py-3 text-sm text-rose-200">{{ error }}</div>{% endif %}
            <form action="/login" method="post" class="space-y-4">
                <div><label class="mb-1 block text-sm font-medium text-slate-300">Email</label><input type="email" name="email" required autocomplete="email" value="{{ form_data.email or '' }}" placeholder="nama@email.com" class="field"></div>
                <div><label class="mb-1 block text-sm font-medium text-slate-300">Kata sandi</label><input type="password" name="password" required autocomplete="current-password" placeholder="Masukkan kata sandi" class="field"></div>
                <button class="mt-2 w-full rounded-lg bg-indigo-600 px-4 py-3 font-medium text-white shadow-lg shadow-indigo-600/30 hover:bg-indigo-500">Masuk</button>
            </form>
            <p class="mt-6 text-center text-sm text-slate-400">Belum punya akun? <a class="font-medium text-indigo-400 hover:text-indigo-300" href="/register">Daftar sekarang</a></p>
        </div>
    </main>
    <footer class="p-6 text-center text-xs text-slate-500">© 2026 TemanKuliah.Id</footer>
    <style>.field { width: 100%; border-radius: .5rem; border: 1px solid rgb(51 65 85); background: rgba(15,23,42,.8); padding: .625rem 1rem; color: rgb(226 232 240); outline: none; } .field:focus { box-shadow: 0 0 0 2px rgb(99 102 241); }</style>
</body>
</html>
